<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;
            padding: 5px 20px;
        }

        td {
            font-weight: 600;
            text-align: center;
        }
        .títulos {
            background-color: gray;
            color: white;
            font-weight: bold;
        }

        .matéria {
            padding: 5px 20px 5px 1px;
            text-align: left;
        }

        .médias {
            background-color: gray;
            color: white;
            padding-left: 5px;
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" class="títulos">Área</th>
                <th rowspan="2" class="títulos">Disciplinas</th>
                <th colspan="2" class="títulos">Notas</th>
                <th rowspan="2" class="títulos">Média</th>
            </tr>
            <tr>
                <th class="títulos">Nota 1</th>
                <th class="títulos">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <th class="matéria">Matemática</th>
                <td>6.7</td>
                <td>9.7</td>
                <td>8.2</td>
            </tr>
            <tr>
                <th class="matéria">Física</th>
                <td>5.3</td>
                <td>5.2</td>
                <td>5.25</td>
            </tr>
            <tr>
                <th class="matéria">Química</th>
                <td>8.5</td>
                <td>7.6</td>
                <td>8.05</td>
            </tr>
            <tr>
                <th class="matéria">Biologia</th>
                <td>7.9</td>
                <td>8.3</td>
                <td>8.1</td>
            </tr>
            <tr>
                <th colspan="4" class="médias">Médias de Exatas</th>
                <td class="títulos">7.4</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <th class="matéria">História</th>
                <td>3.6</td>
                <td>7.1</td>
                <td>5.35</td>
            </tr>
            <tr>
                <th class="matéria">Geografia</th>
                <td>6.8</td>
                <td>6.9</td>
                <td>6.85</td>
            </tr>
            <tr>
                <th colspan="4" class="médias">Média de Humanas</th>
                <td class="títulos">6.1</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
